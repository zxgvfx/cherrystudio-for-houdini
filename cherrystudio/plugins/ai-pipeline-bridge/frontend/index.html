<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Pipeline Bridge</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111217;
      --panel: #1b1d25;
      --panel-2: #232633;
      --text: #ececf3;
      --muted: #a8adbd;
      --accent: #8fb7ff;
      --danger: #ff9c9c;
      --border: #303443;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at 20% 0%, #1e2433 0, var(--bg) 42%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { padding: 28px; }
    body.embedded { padding: 0; height: 100vh; overflow: hidden; }
    main { max-width: 1120px; margin: 0 auto; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: .2px; }
    p { margin: 0; color: var(--muted); line-height: 1.55; }
    .status {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(27, 29, 37, .8);
      color: var(--muted);
      white-space: nowrap;
    }
    .toolbar { display: flex; gap: 12px; margin: 18px 0 20px; }
    input {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--text);
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 14px;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: white; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      display: flex;
      flex-direction: column;
      min-height: 190px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(27, 29, 37, .92);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .16);
    }
    .card h2 { margin: 0 0 8px; font-size: 18px; }
    .card .id { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .card .desc { margin-top: 10px; color: var(--muted); font-size: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
    .tag {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .card footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      color: var(--muted);
      font-size: 12px;
    }
    .primary {
      background: linear-gradient(135deg, #4877ff, #7759ff);
      border-color: transparent;
      color: #fff;
      font-weight: 600;
    }
    .empty, pre#error {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(27, 29, 37, .92);
      padding: 22px;
      color: var(--muted);
    }
    pre#error {
      color: var(--danger);
      white-space: pre-wrap;
    }
    .pipeline-shell {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    .pipeline-shell.hidden { display: none; }
    .pipeline-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: rgba(17, 18, 23, .96);
    }
    .pipeline-url {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
    }
    .pipeline-frame {
      width: 100%;
      flex: 1;
      border: 0;
      background: #0b0c10;
    }
  </style>
</head>
<body>
  <main id="launcher">
    <header>
      <div>
        <h1>AI Pipeline 工作流</h1>
        <p>从当前 ai-pipeline server 自动读取 workflow（默认仅最新版）。点击「打开」进入 server 的 Launch 页填写参数与上传文件。</p>
      </div>
      <div id="status" class="status">正在连接...</div>
    </header>

    <section class="toolbar">
      <input id="search" type="search" placeholder="搜索名称、workflow_id 或 tag" />
      <button id="refresh" type="button">刷新</button>
    </section>

    <section id="content" class="grid"></section>
    <pre id="error" hidden></pre>
  </main>

  <section id="pipeline-shell" class="pipeline-shell hidden">
    <div class="pipeline-bar">
      <button id="back-list" type="button">工作流列表</button>
      <button id="reload-frame" type="button">刷新当前页</button>
      <button id="open-external" type="button">外部打开</button>
      <div id="pipeline-url" class="pipeline-url"></div>
    </div>
    <iframe id="pipeline-frame" class="pipeline-frame" title="AI Pipeline" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
  </section>
  <script>
    const LAST_URL_KEY = "aiPipelineBridgeLastUrl";
    const state = {
      apiBase: "",
      bridgeBase: window.location.origin.replace(/\/+$/, ""),
      workflows: [],
      query: "",
      currentUrl: "",
    };

    const els = {
      body: document.body,
      launcher: document.getElementById("launcher"),
      status: document.getElementById("status"),
      content: document.getElementById("content"),
      error: document.getElementById("error"),
      search: document.getElementById("search"),
      refresh: document.getElementById("refresh"),
      shell: document.getElementById("pipeline-shell"),
      frame: document.getElementById("pipeline-frame"),
      pipelineUrl: document.getElementById("pipeline-url"),
      backList: document.getElementById("back-list"),
      reloadFrame: document.getElementById("reload-frame"),
      openExternal: document.getElementById("open-external"),
    };

    function setStatus(text) {
      els.status.textContent = text;
    }

    function showError(error) {
      els.error.hidden = false;
      els.error.textContent = error && error.message ? error.message : String(error);
      els.content.innerHTML = "";
      setStatus("连接失败");
    }

    function rememberUrl(url) {
      if (!url) return;
      state.currentUrl = url;
      els.pipelineUrl.textContent = url;
      try { localStorage.setItem(LAST_URL_KEY, url); } catch (_) {}
    }

    function openPipelineUrl(url) {
      rememberUrl(url);
      els.frame.src = url;
      els.launcher.hidden = true;
      els.shell.classList.remove("hidden");
      els.body.classList.add("embedded");
    }

    function showLauncher() {
      els.frame.removeAttribute("src");
      state.currentUrl = "";
      try { localStorage.removeItem(LAST_URL_KEY); } catch (_) {}
      history.replaceState(null, "", window.location.pathname);
      els.body.classList.remove("embedded");
      els.shell.classList.add("hidden");
      els.launcher.hidden = false;
    }

    /** 统计 Launch 页会展示的输入项：legacy inputs + parameters(target=input)。 */
    function inputCount(wf) {
      const names = new Set();
      for (const inp of Array.isArray(wf.inputs) ? wf.inputs : []) {
        if (inp && inp.name) names.add(inp.name);
      }
      for (const param of Array.isArray(wf.parameters) ? wf.parameters : []) {
        if (!param || param.target !== "input") continue;
        const key = param.path || param.name;
        if (key) names.add(key);
      }
      return names.size;
    }

    function launchWorkflow(workflowId, workflowVersion) {
      const qs = new URLSearchParams({
        workflow_id: workflowId,
        bridge_base: state.bridgeBase,
      });
      if (workflowVersion) qs.set("version", workflowVersion);
      const url = `${state.apiBase}/launch/?${qs.toString()}`;
      openPipelineUrl(url);
    }

    function text(value, fallback = "") {
      const s = value == null ? "" : String(value);
      return s.trim() || fallback;
    }

    function matchesQuery(wf) {
      const q = state.query.trim().toLowerCase();
      if (!q) return true;
      const haystack = [
        wf.id,
        wf.name,
        wf.description,
        ...(Array.isArray(wf.tags) ? wf.tags : []),
      ].join(" ").toLowerCase();
      return haystack.includes(q);
    }

    function render() {
      els.error.hidden = true;
      els.content.innerHTML = "";
      const items = state.workflows.filter(matchesQuery);
      setStatus(`${items.length}/${state.workflows.length} 个 workflow`);

      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = state.workflows.length ? "没有匹配的 workflow。" : "当前 server 没有注册 workflow。";
        els.content.appendChild(empty);
        return;
      }

      for (const wf of items) {
        const card = document.createElement("article");
        card.className = "card";

        const title = document.createElement("h2");
        title.textContent = text(wf.name, wf.id);

        const id = document.createElement("div");
        id.className = "id";
        id.textContent = `${wf.id}@${wf.version || "latest"}`;

        const desc = document.createElement("p");
        desc.className = "desc";
        desc.textContent = text(wf.description, "无描述");

        const tags = document.createElement("div");
        tags.className = "tags";
        for (const tag of Array.isArray(wf.tags) ? wf.tags : []) {
          const el = document.createElement("span");
          el.className = "tag";
          el.textContent = tag;
          tags.appendChild(el);
        }

        const footer = document.createElement("footer");
        const meta = document.createElement("span");
        const inputs = inputCount(wf);
        meta.textContent = `${wf.source || "workflow"} · ${inputs} 个输入`;
        const button = document.createElement("button");
        button.className = "primary";
        button.type = "button";
        button.textContent = "打开";
        button.addEventListener("click", () => launchWorkflow(wf.id, wf.version || ""));
        footer.append(meta, button);

        card.append(title, id, desc, tags, footer);
        els.content.appendChild(card);
      }
    }

    async function load() {
      setStatus("正在连接...");
      els.error.hidden = true;
      try {
        const healthResponse = await fetch("/api/v1/plugins/ai-pipeline-bridge/health");
        const health = await healthResponse.json();
        if (!healthResponse.ok || health.error || !health.available) {
          throw new Error(health.error || health.detail || `HTTP ${healthResponse.status}`);
        }
        state.apiBase = String(health.api_base || "").replace(/\/+$/, "");
        if (!state.apiBase) throw new Error("ai-pipeline api_base 为空");

        const params = new URLSearchParams(window.location.search);
        const workflowId = params.get("workflow_id");
        if (workflowId) {
          launchWorkflow(workflowId, params.get("version") || "");
          return;
        }

        const restore = params.get("restore") !== "0";
        const lastUrl = restore ? localStorage.getItem(LAST_URL_KEY) : "";
        if (lastUrl && /^https?:\/\//i.test(lastUrl)) {
          openPipelineUrl(lastUrl);
          return;
        }

        const workflowsResponse = await fetch("/api/v1/plugins/ai-pipeline-bridge/workflows");
        const payload = await workflowsResponse.json();
        if (!workflowsResponse.ok || payload.error) {
          throw new Error(payload.error || `HTTP ${workflowsResponse.status}`);
        }
        state.workflows = Array.isArray(payload.workflows) ? payload.workflows : [];
        render();
      } catch (error) {
        showError(error);
      }
    }

    els.search.addEventListener("input", (event) => {
      state.query = event.target.value || "";
      render();
    });
    els.refresh.addEventListener("click", load);
    els.backList.addEventListener("click", () => {
      if (confirm("回到工作流列表？当前 AI Pipeline 页面会关闭，但 run 不会停止。")) showLauncher();
    });
    els.reloadFrame.addEventListener("click", () => {
      if (state.currentUrl) els.frame.src = state.currentUrl;
    });
    els.openExternal.addEventListener("click", () => {
      if (state.currentUrl) window.open(state.currentUrl, "_blank", "noopener");
    });
    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (!msg || typeof msg !== "object") return;
      if (msg.type !== "ai-pipeline:navigate" || !msg.url) return;
      rememberUrl(String(msg.url));
    });
    load();
  </script>
</body>
</html>
