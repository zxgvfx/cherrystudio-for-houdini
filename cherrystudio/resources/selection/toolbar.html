<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selection Toolbar</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: transparent;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  scrollbar-width: none;
}
body::-webkit-scrollbar { display: none; }

:root {
  --bg: rgba(245, 245, 245, 0.95);
  --border: rgba(0, 0, 0, 0.08);
  --shadow: 0 2px 12px rgba(0, 0, 0, 0.12), 0 0 1px rgba(0, 0, 0, 0.08);
  --icon-color: #555;
  --hover-bg: rgba(0, 0, 0, 0.06);
  --primary: #4a90d9;
  --label-color: #444;
  --logo-bg: linear-gradient(135deg, #e74c6f, #d63b5c);
}

[data-theme="dark"] {
  --bg: rgba(30, 30, 30, 0.95);
  --border: rgba(255, 255, 255, 0.08);
  --shadow: 0 2px 12px rgba(0, 0, 0, 0.35), 0 0 1px rgba(0, 0, 0, 0.2);
  --icon-color: #b0b0b0;
  --hover-bg: rgba(255, 255, 255, 0.08);
  --primary: #5ba0e6;
  --label-color: #ccc;
  --logo-bg: linear-gradient(135deg, #e74c6f, #d63b5c);
}

.toolbar {
  display: inline-flex;
  align-items: center;
  height: 36px;
  border-radius: 20px;
  background: var(--bg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  padding: 0 6px 0 8px;
  gap: 2px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  opacity: 0;
  transform: scale(0.92) translateY(4px);
  animation: toolbar-show 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards;
}

@keyframes toolbar-show {
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  margin-right: 4px;
  flex-shrink: 0;
  animation: logo-rotate 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes logo-rotate {
  from { transform: rotate(-30deg) scale(0.8); opacity: 0.5; }
  to { transform: rotate(0deg) scale(1); opacity: 1; }
}

.logo svg {
  width: 22px;
  height: 22px;
}

.actions {
  display: flex;
  align-items: center;
  gap: 2px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 26px;
  min-width: 26px;
  padding: 0 5px;
  border: none;
  background: transparent;
  border-radius: 14px;
  cursor: pointer;
  color: var(--icon-color);
  transition: background 0.15s, color 0.15s, transform 0.1s;
  outline: none;
  position: relative;
}

.btn:hover {
  background: var(--hover-bg);
  color: var(--primary);
}

.btn:active {
  transform: scale(0.92);
}

.btn svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

.btn-label {
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  color: var(--label-color);
  transition: width 0.2s, opacity 0.2s, margin 0.2s;
  overflow: hidden;
}

.compact .btn-label {
  width: 0 !important;
  opacity: 0;
  margin: 0;
}

.btn .icon-check { display: none; }
.btn.copied .icon-main { display: none; }
.btn.copied .icon-check { display: block; color: #22c55e; }

.separator {
  width: 1px;
  height: 16px;
  background: var(--border);
  margin: 0 2px;
  flex-shrink: 0;
}
</style>
</head>
<body>
<div class="toolbar compact" id="toolbar">
  <div class="logo">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#e74c6f"/>
          <stop offset="100%" stop-color="#d63b5c"/>
        </linearGradient>
      </defs>
      <path d="M52 18 C52 18 56 4 68 6 C74 7 76 14 72 18 C68 22 58 22 52 18Z" fill="#4a8c3f"/>
      <path d="M48 18 C48 18 44 4 32 6 C26 7 24 14 28 18 C32 22 42 22 48 18Z" fill="#5a9e4e"/>
      <path d="M50 20 C50 20 49 10 50 6" stroke="#4a8c3f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="36" cy="52" r="22" fill="url(#cg)"/>
      <circle cx="64" cy="52" r="22" fill="url(#cg)"/>
      <ellipse cx="30" cy="46" rx="5" ry="6" fill="rgba(255,255,255,0.25)"/>
      <ellipse cx="58" cy="46" rx="5" ry="6" fill="rgba(255,255,255,0.25)"/>
    </svg>
  </div>

  <div class="separator"></div>

  <div class="actions">
    <button class="btn" data-action="translate" title="翻译">
      <svg viewBox="0 0 24 24" class="icon-main"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
      <span class="btn-label">翻译</span>
    </button>

    <button class="btn" data-action="explain" title="解释">
      <svg viewBox="0 0 24 24" class="icon-main"><path d="M12 17h.01"/><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 3-3 3"/></svg>
      <span class="btn-label">解释</span>
    </button>

    <button class="btn" data-action="summary" title="总结">
      <svg viewBox="0 0 24 24" class="icon-main"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8h8"/><path d="M7 12h10"/><path d="M7 16h6"/></svg>
      <span class="btn-label">总结</span>
    </button>

    <button class="btn" data-action="copy" title="复制">
      <svg viewBox="0 0 24 24" class="icon-main"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M16 4h2a2 2 0 0 1 2 2v4"/><path d="M21 14H11"/><path d="m15 10-4 4 4 4"/></svg>
      <svg viewBox="0 0 24 24" class="icon-check"><path d="M20 6 9 17l-5-5"/></svg>
      <span class="btn-label">复制</span>
    </button>

    <button class="btn" data-action="quote" title="引用">
      <svg viewBox="0 0 24 24" class="icon-main"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>
      <span class="btn-label">引用</span>
    </button>
  </div>
</div>

<script>
(function() {
  var toolbar = document.getElementById('toolbar');
  var copyTimer = null;

  document.querySelectorAll('.btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var action = this.dataset.action;
      if (action === 'copy') {
        showCopySuccess(this);
      }
      if (window.qtBridge && window.qtBridge.onAction) {
        window.qtBridge.onAction(action);
      }
    });
  });

  function showCopySuccess(btn) {
    if (copyTimer) clearTimeout(copyTimer);
    btn.classList.add('copied');
    copyTimer = setTimeout(function() {
      btn.classList.remove('copied');
      copyTimer = null;
    }, 1500);
  }

  window.showCopySuccess = function() {
    var btn = document.querySelector('.btn[data-action="copy"]');
    if (btn) showCopySuccess(btn);
  };

  window.setTheme = function(theme) {
    document.documentElement.setAttribute('data-theme', theme);
  };

  window.setCompact = function(isCompact) {
    if (isCompact) {
      toolbar.classList.add('compact');
    } else {
      toolbar.classList.remove('compact');
    }
    reportSize();
  };

  function reportSize() {
    requestAnimationFrame(function() {
      var rect = toolbar.getBoundingClientRect();
      var w = Math.ceil(rect.width) + 2;
      var h = Math.ceil(rect.height) + 2;
      if (window.qtBridge && window.qtBridge.onReady) {
        window.qtBridge.onReady(w, h);
      }
    });
  }

  window.addEventListener('load', function() {
    reportSize();
  });
})();
</script>
</body>
</html>
