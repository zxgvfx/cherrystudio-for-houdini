<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SAM3</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="layout">
      <main class="panel viewer">
        <div id="stage" class="stage empty">
          <div id="canvas-grid" class="canvas-grid"></div>
          <div id="viewport" class="viewport">
            <img id="image-view" alt="source" />
            <div id="mask-layer"></div>
            <div id="points-layer"></div>
          </div>
          <div id="hud" class="hud">
            <span id="hud-cursor">X:- Y:-</span>
            <span id="hud-zoom">Zoom: 100%</span>
          </div>
          <button id="upload-btn" class="upload-floating" type="button">UPLOAD SOURCE</button>
          <div id="stage-empty" class="stage-empty">WAITING FOR SOURCE</div>
        </div>
      </main>

      <aside class="panel controls">
        <h1>NeuroSegment</h1>
        <p class="muted">1:1 迁移旧版 SAM3 主交互：图层、打点、右键删点、Ctrl+Z、批量 3D。</p>

        <input id="image-input" class="hidden-input" type="file" accept="image/*" />

        <section class="section">
          <div class="section-title">CONTROLS</div>
          <div class="mode-group">
            <button id="fg-mode-btn" class="active" type="button">FOREGROUND</button>
            <button id="bg-mode-btn" type="button">BACKGROUND</button>
          </div>
          <div class="button-row">
            <button id="add-layer-btn" type="button">+ NEW OBJ</button>
            <button id="clear-points-btn" type="button">CLEAR PTS</button>
          </div>
        </section>

        <section class="section">
          <div class="section-header">
            <div class="section-title">DETECTED OBJECTS</div>
            <button id="reset-btn" class="text-danger" type="button">RESET</button>
          </div>
          <div id="layers-list" class="layers-list"></div>
        </section>

        <section class="section">
          <div class="section-title">3D RECONSTRUCTION</div>
          <input id="server-url-input" class="text-input" type="text" value="http://192.168.21.225:8000" />
          <div class="button-column">
            <button id="generate-3d-btn" class="primary-btn" type="button">GENERATE MODEL</button>
            <button id="save-mask-btn" type="button">EXPORT MASK</button>
            <button id="check-status-btn" type="button">CHECK SERVICE</button>
          </div>
        </section>

        <section class="section">
          <div class="section-title">STATUS</div>
          <div class="status-block">
            <div><strong>Session:</strong> <span id="session-value">-</span></div>
            <div><strong>Image:</strong> <span id="image-value">-</span></div>
            <div><strong>Active:</strong> <span id="active-layer-value">-</span></div>
            <div><strong>Mask:</strong> <span id="mask-value">-</span></div>
          </div>
          <div id="models-list" class="models-list"></div>
          <pre id="log-output" class="log-output">SYSTEM INITIALIZING...</pre>
        </section>
      </aside>
    </div>

    <div id="loading-overlay" class="loading-overlay hidden">
      <div class="loading-card">
        <div class="spinner"></div>
        <div id="loading-title" class="loading-title">加载中...</div>
        <div id="loading-detail" class="loading-detail"></div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
