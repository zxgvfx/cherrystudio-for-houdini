<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cherry Action</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: rgba(255,255,255,0.98);
  --bg-solid: #ffffff;
  --text: #1a1a1a;
  --text-secondary: #666;
  --border: rgba(0,0,0,0.08);
  --titlebar-bg: rgba(245,245,245,0.95);
  --content-bg: #fafafa;
  --code-bg: #f0f0f0;
  --code-block-bg: #282c34;
  --code-block-text: #abb2bf;
  --btn-hover: rgba(0,0,0,0.06);
  --accent: #7c5cfc;
  --accent-light: rgba(124,92,252,0.1);
  --footer-bg: rgba(245,245,245,0.9);
  --shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.08);
  --scrollbar-thumb: rgba(0,0,0,0.15);
  --spinner-color: #7c5cfc;
  --kbd-bg: rgba(0,0,0,0.06);
  --kbd-border: rgba(0,0,0,0.1);
}

[data-theme="dark"] {
  --bg: rgba(30,30,30,0.98);
  --bg-solid: #1e1e1e;
  --text: #e0e0e0;
  --text-secondary: #999;
  --border: rgba(255,255,255,0.08);
  --titlebar-bg: rgba(38,38,38,0.95);
  --content-bg: #252525;
  --code-bg: #2d2d2d;
  --code-block-bg: #1a1a2e;
  --code-block-text: #c5c8c6;
  --btn-hover: rgba(255,255,255,0.08);
  --accent: #9b7dff;
  --accent-light: rgba(155,125,255,0.12);
  --footer-bg: rgba(38,38,38,0.9);
  --shadow: 0 8px 32px rgba(0,0,0,0.4), 0 2px 8px rgba(0,0,0,0.3);
  --scrollbar-thumb: rgba(255,255,255,0.15);
  --spinner-color: #9b7dff;
  --kbd-bg: rgba(255,255,255,0.08);
  --kbd-border: rgba(255,255,255,0.12);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  color: var(--text);
  user-select: none;
}

#window-frame {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  background: var(--bg);
  border-radius: 12px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* ── Title Bar ── */
#titlebar {
  display: flex; align-items: center;
  height: 40px; min-height: 40px;
  padding: 0 12px;
  background: var(--titlebar-bg);
  border-bottom: 1px solid var(--border);
  -webkit-app-region: drag;
  gap: 8px;
}

#titlebar-icon {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  flex-shrink: 0;
}

#titlebar-text {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
}

.titlebar-buttons {
  display: flex; align-items: center; gap: 2px;
  -webkit-app-region: no-drag;
}

.tb-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: none;
  border-radius: 6px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  -webkit-app-region: no-drag;
}
.tb-btn:hover { background: var(--btn-hover); color: var(--text); }
.tb-btn.pinned { color: var(--accent); }
.tb-btn.close-btn:hover { background: #e74c3c; color: #fff; }
.tb-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ── Content ── */
#content-wrapper {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px;
  background: var(--content-bg);
  scroll-behavior: smooth;
}

#content-wrapper::-webkit-scrollbar { width: 6px; }
#content-wrapper::-webkit-scrollbar-track { background: transparent; }
#content-wrapper::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }

#content {
  user-select: text;
  line-height: 1.7;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

/* ── Markdown Styles ── */
#content h1, #content h2, #content h3, #content h4 { margin: 0.8em 0 0.4em; font-weight: 600; }
#content h1 { font-size: 1.4em; }
#content h2 { font-size: 1.2em; }
#content h3 { font-size: 1.1em; }
#content p { margin: 0.5em 0; }
#content ul, #content ol { margin: 0.5em 0; padding-left: 1.5em; }
#content li { margin: 0.2em 0; }
#content blockquote {
  margin: 0.5em 0; padding: 8px 14px;
  border-left: 3px solid var(--accent);
  background: var(--accent-light);
  border-radius: 0 6px 6px 0;
  color: var(--text-secondary);
}
#content a { color: var(--accent); text-decoration: none; }
#content a:hover { text-decoration: underline; }
#content hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
#content table { border-collapse: collapse; width: 100%; margin: 0.5em 0; font-size: 13px; }
#content th, #content td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
#content th { background: var(--accent-light); font-weight: 600; }
#content img { max-width: 100%; border-radius: 6px; }

#content code {
  font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, monospace;
  font-size: 0.88em;
  background: var(--code-bg);
  padding: 2px 5px;
  border-radius: 4px;
}

#content pre {
  margin: 0.6em 0;
  border-radius: 8px;
  background: var(--code-block-bg);
  overflow-x: auto;
  position: relative;
}
#content pre code {
  display: block;
  padding: 14px 16px;
  background: none;
  color: var(--code-block-text);
  font-size: 13px;
  line-height: 1.5;
  white-space: pre;
}

/* ── Loading ── */
#loading {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 8px 0;
  color: var(--text-secondary);
  font-size: 13px;
}
#loading.visible { display: flex; }

.dot-pulse {
  display: flex; gap: 4px; align-items: center;
}
.dot-pulse span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--spinner-color);
  animation: dotBounce 1.4s infinite ease-in-out both;
}
.dot-pulse span:nth-child(1) { animation-delay: -0.32s; }
.dot-pulse span:nth-child(2) { animation-delay: -0.16s; }

@keyframes dotBounce {
  0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}

/* ── Footer ── */
#footer {
  display: flex; align-items: center; justify-content: center;
  height: 32px; min-height: 32px;
  padding: 0 16px;
  background: var(--footer-bg);
  border-top: 1px solid var(--border);
  gap: 16px;
  font-size: 11px;
  color: var(--text-secondary);
}

kbd {
  display: inline-block;
  padding: 1px 5px;
  font-family: inherit;
  font-size: 10px;
  background: var(--kbd-bg);
  border: 1px solid var(--kbd-border);
  border-radius: 3px;
  margin: 0 2px;
  line-height: 1.4;
}

/* ── Error ── */
.error-msg {
  color: #e74c3c;
  background: rgba(231,76,60,0.08);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  margin: 4px 0;
}
</style>
</head>
<body>

<div id="window-frame">
  <!-- Title Bar -->
  <div id="titlebar">
    <div id="titlebar-icon">
      <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    </div>
    <div id="titlebar-text">Cherry Action</div>
    <div class="titlebar-buttons">
      <button class="tb-btn pin-btn" id="btn-pin" title="置顶">
        <svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
      </button>
      <button class="tb-btn" id="btn-minimize" title="最小化">
        <svg viewBox="0 0 24 24"><path d="M8 12h8"/></svg>
      </button>
      <button class="tb-btn close-btn" id="btn-close" title="关闭">
        <svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
  </div>

  <!-- Content -->
  <div id="content-wrapper">
    <div id="content"></div>
    <div id="loading">
      <div class="dot-pulse"><span></span><span></span><span></span></div>
      <span>正在生成...</span>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer">
    <span><kbd>ESC</kbd> 关闭</span>
    <span><kbd>R</kbd> 重新生成</span>
    <span><kbd>C</kbd> 复制</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(function() {
  'use strict';

  // ── State ──
  let _rawContent = '';
  let _isPinned = false;
  let _isStreaming = false;
  let _currentAction = null;
  let _abortController = null;

  const contentEl = document.getElementById('content');
  const loadingEl = document.getElementById('loading');
  const titleTextEl = document.getElementById('titlebar-text');

  // ── Markdown renderer ──
  function renderMarkdown(text) {
    if (typeof marked !== 'undefined' && marked.parse) {
      try {
        return marked.parse(text, { breaks: true, gfm: true });
      } catch(e) { /* fallback */ }
    }
    return escapeHtml(text).replace(/\n/g, '<br>');
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function updateDisplay() {
    contentEl.innerHTML = renderMarkdown(_rawContent);
    const wrapper = document.getElementById('content-wrapper');
    wrapper.scrollTop = wrapper.scrollHeight;
  }

  // ── Public API ──
  window.appendChunk = function(text) {
    _rawContent += text;
    updateDisplay();
  };

  window.setContent = function(text) {
    _rawContent = text;
    updateDisplay();
  };

  window.clearContent = function() {
    _rawContent = '';
    contentEl.innerHTML = '';
  };

  window.setTheme = function(theme) {
    document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
  };

  window.setAction = function(actionData) {
    _currentAction = actionData;
    if (actionData.name) {
      titleTextEl.textContent = actionData.name;
    }
    startStreaming(actionData);
  };

  // ── Streaming ──
  function showLoading(show) {
    loadingEl.classList.toggle('visible', show);
  }

  async function startStreaming(action) {
    if (_abortController) _abortController.abort();
    _abortController = new AbortController();

    window.clearContent();
    _isStreaming = true;
    showLoading(true);

    const baseUrl = window.__CHERRY_BACKEND_URL || 'http://127.0.0.1:39182';
    const url = baseUrl + '/v1/chat/completions';
    const model = window.__SELECTION_MODEL || 'default';

    const userContent = (action.prompt || '') + (action.selectedText || '');

    try {
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: model,
          messages: [{ role: 'user', content: userContent }],
          stream: true
        }),
        signal: _abortController.signal
      });

      if (!resp.ok) {
        const errText = await resp.text().catch(() => resp.statusText);
        throw new Error('API error ' + resp.status + ': ' + errText);
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || !trimmed.startsWith('data:')) continue;
          const dataStr = trimmed.slice(5).trim();
          if (dataStr === '[DONE]') continue;

          try {
            const json = JSON.parse(dataStr);
            const delta = json.choices && json.choices[0] && json.choices[0].delta;
            if (delta && delta.content) {
              window.appendChunk(delta.content);
            }
          } catch(e) { /* skip malformed chunk */ }
        }
      }
    } catch(err) {
      if (err.name === 'AbortError') return;
      contentEl.innerHTML += '<div class="error-msg">请求失败: ' + escapeHtml(err.message) + '</div>';
    } finally {
      _isStreaming = false;
      showLoading(false);
    }
  }

  // ── Title bar buttons ──
  const btnPin = document.getElementById('btn-pin');
  const btnMinimize = document.getElementById('btn-minimize');
  const btnClose = document.getElementById('btn-close');

  btnPin.addEventListener('click', function() {
    _isPinned = !_isPinned;
    btnPin.classList.toggle('pinned', _isPinned);
    if (window.qtBridge && window.qtBridge.onPin) {
      window.qtBridge.onPin(_isPinned);
    }
  });

  btnMinimize.addEventListener('click', function() {
    if (window.qtBridge && window.qtBridge.onMinimize) {
      window.qtBridge.onMinimize();
    }
  });

  btnClose.addEventListener('click', function() {
    if (_abortController) _abortController.abort();
    if (window.qtBridge && window.qtBridge.onClose) {
      window.qtBridge.onClose();
    }
  });

  // ── Keyboard shortcuts ──
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    if (e.key === 'Escape') {
      e.preventDefault();
      if (_abortController) _abortController.abort();
      if (window.qtBridge && window.qtBridge.onClose) {
        window.qtBridge.onClose();
      }
    }

    if (e.key === 'r' || e.key === 'R') {
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      e.preventDefault();
      if (_currentAction) {
        startStreaming(_currentAction);
      }
      if (window.qtBridge && window.qtBridge.onRegenerate) {
        window.qtBridge.onRegenerate();
      }
    }

    if (e.key === 'c' || e.key === 'C') {
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      if (window.getSelection().toString()) return;
      e.preventDefault();
      const text = _rawContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function(){});
      }
      if (window.qtBridge && window.qtBridge.onCopy) {
        window.qtBridge.onCopy(text);
      }
    }
  });
})();
</script>
</body>
</html>
